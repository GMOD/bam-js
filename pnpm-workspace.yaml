minimumReleaseAge: 4320
# Our own packages are exempt from the quarantine: a bump here is normally made
# minutes after the dependency's own release, from source in the next directory
# over, and the quarantine would otherwise hold that chain up for three days.
# Same exemption jbrowse-components carries for the same reason.
minimumReleaseAgeExclude:
  - '@gmod/*'
  - '@jbrowse/quick-lru'
  # TypeScript 7.1 ships only as the tsrs beta (published 2026-11-07), which
  # the 3-day quarantine would hold back until 2026-11-10. tsrs and its
  # per-platform binaries only; drop this once the beta ages in.
  - 'tsrs'
  - '@tsrs/*'
allowBuilds:
  esbuild: true
  unrs-resolver: true
